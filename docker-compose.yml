services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      TRAINER_APP_PASSWORD: ${TRAINER_APP_PASSWORD:?set TRAINER_APP_PASSWORD in .env}
      TRAINER_MIGRATOR_PASSWORD: ${TRAINER_MIGRATOR_PASSWORD:?set TRAINER_MIGRATOR_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer} -d ${POSTGRES_DB:-trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Avoid clashing with a host Postgres; app traffic stays on the Compose network
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      TRAINER_APP_PASSWORD: ${TRAINER_APP_PASSWORD:?set TRAINER_APP_PASSWORD in .env}
      TRAINER_MIGRATOR_PASSWORD: ${TRAINER_MIGRATOR_PASSWORD:?set TRAINER_MIGRATOR_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    # Host :8000 for Vite (`npm run dev` proxies /api → 127.0.0.1:8000).
    # Same-origin stack still uses Caddy → api:8000 on the Compose network.
    ports:
      - "8000:8000"
    expose:
      - "8000"
    volumes:
      # Hot-reload for local API work (image still owns deps)
      - ./backend:/app/backend:ro
      - ./pyproject.toml:/app/pyproject.toml:ro

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"

  proxy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/data:/data
      - ./infra/caddy/config:/config
    depends_on:
      - api
      - web

  # One-shot ops services (invoked by host cron / compose run — no HTTP triggers)
  backup:
    profiles: ["ops"]
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      BACKUP_DIR: /backup
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_PASSPHRASE: ${BACKUP_ENCRYPTION_PASSPHRASE:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    volumes:
      - ./infra/backup:/scripts:ro
      - ./infra/backup/out:/backup
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  purge:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      TRAINER_APP_PASSWORD: ${TRAINER_APP_PASSWORD:?set TRAINER_APP_PASSWORD in .env}
      PURGE_HEARTBEAT_PATH: ${PURGE_HEARTBEAT_PATH:-}
    volumes:
      - ./backend:/app/backend:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    entrypoint: ["python", "-m", "app.jobs.purge"]
    depends_on:
      db:
        condition: service_healthy

  cleanup:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      TRAINER_APP_PASSWORD: ${TRAINER_APP_PASSWORD:?set TRAINER_APP_PASSWORD in .env}
    volumes:
      - ./backend:/app/backend:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    entrypoint: ["python", "-m", "app.jobs.cleanup"]
    depends_on:
      db:
        condition: service_healthy

  satellite-finalize:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
      TRAINER_APP_PASSWORD: ${TRAINER_APP_PASSWORD:?set TRAINER_APP_PASSWORD in .env}
      SATELLITE_FINALIZE_HEARTBEAT_PATH: ${SATELLITE_FINALIZE_HEARTBEAT_PATH:-}
      SATELLITE_FINALIZE_LIMIT: ${SATELLITE_FINALIZE_LIMIT:-500}
    volumes:
      - ./backend:/app/backend:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
    entrypoint: ["python", "-m", "app.jobs.satellite_finalize"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
