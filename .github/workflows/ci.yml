name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  backend-lint:
    name: Backend lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build API image
        run: docker compose build api
      - name: Ruff
        run: docker compose run --rm --no-deps api ruff check backend
      - name: Mypy
        run: docker compose run --rm --no-deps api mypy

  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build API image
        run: docker compose build api
      - name: Start database
        run: docker compose up -d db
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U trainer -d trainer && exit 0
            sleep 2
          done
          exit 1
      - name: Alembic upgrade (when configured)
        run: |
          if docker compose run --rm --no-deps api sh -c 'test -f alembic.ini || test -f backend/alembic.ini'; then
            docker compose run --rm api alembic upgrade head
          else
            echo "Alembic not configured yet — skip migrate (db-core)"
          fi
      - name: Pytest
        run: docker compose run --rm api pytest
      - name: Tear down
        if: always()
        run: docker compose down -v

  backend-idor:
    name: Backend IDOR suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build API image
        run: docker compose build api
      - name: Start database
        run: docker compose up -d db
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U trainer -d trainer && exit 0
            sleep 2
          done
          exit 1
      - name: Pytest IDOR
        run: docker compose run --rm api pytest -m idor
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  i18n-gate:
    name: i18n completeness (pl-PL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check pl-PL keys
        run: node scripts/check_i18n_pl.mjs

  content-gate:
    name: Content gate (soft until F1.prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run content gate
        env:
          TRAINER_CONTENT_GATE_STRICT: "0"
        run: python scripts/check_content_gate.py

  e2e:
    name: Playwright E2E (Compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend-test]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build and start Compose stack
        run: docker compose up -d --build db api web proxy
      - name: Wait for same-origin health
        run: |
          for i in $(seq 1 60); do
            if curl -kf https://localhost/api/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Playwright
        working-directory: frontend
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: https://localhost
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v
