name: Security Audit

on:
  schedule:
    # Every Monday 06:00 UTC (08:00 CEST / 07:00 CET)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  frontend-audit:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  backend-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Sync locked dependencies
        run: uv sync --frozen --group dev --no-install-project
      - name: Export requirements and audit
        run: |
          uv export --frozen --group dev --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
