[project]
name = "trainer"
version = "0.1.0"
description = "Trainer — Convict Conditioning PWA (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "uuid6>=2025.0.0",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-config=pyproject.toml",
]
markers = [
  "idor: IDOR / tenant isolation (FR-005b) — required CI job",
  "concurrency: parallel race tests (auth sessions, satellites, CAS sync)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/alembic/*",
  "*/__main__.py",
  "*/conftest.py",
  "*/jobs/*",
  "*/db/session.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
  "raise NotImplementedError",
]

[tool.coverage.paths]
source = ["backend/app", "*/site-packages/app"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "backend"
packages = ["app"]
