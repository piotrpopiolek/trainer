[project]
name = "trainer"
version = "0.1.0"
description = "Trainer — Convict Conditioning PWA (FastAPI + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps land with backend scaffold (FastAPI, SQLAlchemy, …).
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=backend",
  "--cov-report=term-missing",
  "--cov-config=pyproject.toml",
]
markers = [
  "idor: IDOR / tenant isolation (FR-005b) — required CI job",
  "concurrency: parallel race tests (auth sessions, satellites, CAS sync)",
]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
  "*/tests/*",
  "*/migrations/*",
  "*/alembic/*",
  "*/seed/*",
  "*/__main__.py",
  "*/conftest.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "\\.\\.\\.",
  "raise NotImplementedError",
]

[tool.coverage.paths]
source = ["backend", "*/site-packages/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "backend"
packages = ["backend"]
